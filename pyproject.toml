[project]
name = "patribot"
version = "0.1.0"
description = "AI travel planner for Indian Railways: data platform, ETA model, itinerary planner, Claude chat."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dagster>=1.13.25",
    "dagster-dbt>=0.29.25",
    "dbt-duckdb>=1.11.0",
    "duckdb>=1.5.6",
    "httpx>=0.27",
    "psycopg[binary]>=3.3.6",
    "pyarrow>=25.0.1",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "tzdata>=2024.1",
]

[project.scripts]
patribot-collector = "patribot.collector.cli:main"
patribot-watchlist = "patribot.watchlist.cli:main"

[dependency-groups]
dev = [
    "dagster-webserver>=1.13.25",
    "pytest>=8.2",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/patribot"]

[tool.dagster]
module_name = "pipelines.definitions"
code_location_name = "patribot"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
