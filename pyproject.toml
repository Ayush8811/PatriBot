[project]
name = "patribot"
version = "0.1.0"
description = "AI travel planner for Indian Railways: data platform, ETA model, itinerary planner, Claude chat."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "tzdata>=2024.1",
]

[project.scripts]
patribot-collector = "patribot.collector.cli:main"
patribot-watchlist = "patribot.watchlist.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/patribot"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
