name: collector

# Collects completed train runs every 3 hours into the private data repo (architecture doc §2).
# Scheduled workflows only run from the default branch, so this starts once merged to main.
#
# Repository settings needed (Settings → Secrets and variables → Actions):
#   secrets.RAIL_API_KEY       railway data API key
#   secrets.DATA_REPO_TOKEN    fine-grained token: Contents read/write on the data repo only
#   vars.DATA_REPO             e.g. ayush8811/patribot-data
#   vars.RAIL_SOURCE           e.g. indianrailapi   (defaults to "fixture", which makes no API calls)

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

concurrency:
  group: collector
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HAS_DATA_REPO: ${{ secrets.DATA_REPO_TOKEN != '' && vars.DATA_REPO != '' }}
    steps:
      - name: Check configuration
        if: env.HAS_DATA_REPO != 'true'
        run: echo "::notice::Collector not configured yet (DATA_REPO_TOKEN / DATA_REPO missing); skipping."

      - uses: actions/checkout@v4
        if: env.HAS_DATA_REPO == 'true'

      - uses: actions/checkout@v4
        if: env.HAS_DATA_REPO == 'true'
        with:
          repository: ${{ vars.DATA_REPO }}
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: data

      - uses: astral-sh/setup-uv@v6
        if: env.HAS_DATA_REPO == 'true'

      - name: Collect
        if: env.HAS_DATA_REPO == 'true'
        env:
          RAIL_API_KEY: ${{ secrets.RAIL_API_KEY }}
        run: uv run --frozen patribot-collector run --data-dir data --source "${{ vars.RAIL_SOURCE || 'fixture' }}"

      - name: Commit to data repo
        if: always() && env.HAS_DATA_REPO == 'true'
        working-directory: data
        run: |
          git config user.name "patribot-collector"
          git config user.email "patribot-collector@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -q -m "collect: $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull -q --rebase && git push -q && exit 0; sleep $((i * 5)); done
          exit 1
