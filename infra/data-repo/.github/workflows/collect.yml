name: collect

# Lives in the PRIVATE data repo (Ayush8811/patribot-data), never in the public code repo: RailKit data must not
# be published (BRD D15). It checks out the public code repo, runs the collector against this repo, and commits
# with the built-in GITHUB_TOKEN, so no personal access token is needed.
#
# Needs one secret in this repo: RAIL_API_KEY (RailKit key). Without it, runs are skipped.
# Pushes made by this workflow use GITHUB_TOKEN, which never re-triggers workflows (no loops).

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [watchlist.yaml, collect-request.txt]   # run right away when the watchlist changes, or on request

concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_KEY: ${{ secrets.RAIL_API_KEY != '' }}
    steps:
      - name: Check configuration
        if: env.HAS_KEY != 'true'
        run: echo "::notice::RAIL_API_KEY secret not set; skipping."

      - uses: actions/checkout@v4
        if: env.HAS_KEY == 'true'

      - uses: actions/checkout@v4
        if: env.HAS_KEY == 'true'
        with:
          repository: Ayush8811/PatriBot
          ref: main
          path: .code

      - uses: astral-sh/setup-uv@v6
        if: env.HAS_KEY == 'true'

      - name: Collect
        if: env.HAS_KEY == 'true'
        env:
          RAIL_API_KEY: ${{ secrets.RAIL_API_KEY }}
          RAIL_MIN_INTERVAL_S: ${{ vars.RAIL_MIN_INTERVAL_S || '1.1' }}
        run: |
          # a watchlist.yaml in this private repo overrides the public seed list
          wl=.code/config/watchlist.yaml; [ -f watchlist.yaml ] && wl=watchlist.yaml
          uv run --project .code --frozen patribot-collector run \
            --data-dir . --watchlist "$wl" --source "${{ vars.RAIL_SOURCE || 'railkit' }}"

      - name: Commit
        if: always() && env.HAS_KEY == 'true'
        run: |
          git config user.name "patribot-collector"
          git config user.email "patribot-collector@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -q -m "collect: $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull -q --rebase && git push -q && exit 0; sleep $((i * 5)); done
          exit 1
