version: 2

# Generated from config/corridors.yaml by `uv run python -m patribot.transform.seeds`. Do not edit by hand:
# tests/test_transform_seeds.py fails when they drift from the config.
seeds:
  - name: seed_station_cluster
    columns:
      - name: station_code
        data_tests: [unique, not_null]
      - name: cluster_id
        data_tests: [not_null]
  - name: seed_corridor
    columns:
      - name: corridor_id
        data_tests: [unique, not_null]
      - name: cluster_a
        data_tests:
          - relationships:
              arguments:
                to: ref('seed_station_cluster')
                field: cluster_id
      - name: cluster_b
        data_tests:
          - relationships:
              arguments:
                to: ref('seed_station_cluster')
                field: cluster_id
  - name: seed_corridor_waypoint
    columns:
      - name: corridor_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('seed_corridor')
                field: corridor_id
      - name: station_code
        data_tests: [not_null]
  - name: seed_corridor_split_hub
    columns:
      - name: corridor_id
        data_tests:
          - relationships:
              arguments:
                to: ref('seed_corridor')
                field: corridor_id
  - name: seed_corridor_membership_param
    columns:
      - name: param
        data_tests: [unique, not_null]

  # Hand-kept, not generated from the corridor config.
  - name: calendar_events
    description: >
      National holidays, festival travel-rush windows (Holi, Eid, Durga Puja, Diwali, Chhath, Christmas/New Year) and
      the North India fog season, 2026–2027. Lunar festival dates and all window bounds are approximate
      (`approximate = true`); check them against the official holiday list before relying on them.
    columns:
      - name: event_id
        data_tests: [unique, not_null]
      - name: kind
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [national_holiday, festival_window, fog_season]
      - name: end_date
        data_tests:
          - not_null
          - expression_is_true:
              arguments:
                expression: "end_date >= start_date and (peak_date is null or peak_date between start_date and end_date)"
